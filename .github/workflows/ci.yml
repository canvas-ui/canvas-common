name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .public-workspace
    steps:
      - uses: actions/checkout@v4
      # No version input: pnpm/action-setup reads the packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Test repository retention policy
        run: node --test .github/tests/housekeeping.test.mjs
        working-directory: .
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
        working-directory: .
      - run: node scripts/install-public.mjs
        working-directory: .
      - run: pnpm run lint
      - run: CANVAS_TEST_BUN=$(command -v bun) pnpm run test
      - run: node --test scripts/tests/*.test.mjs
      # Every npm package must stage as a self-contained package on every PR
      # (registry mode, exactly what release.yml publishes), so a broken
      # package fails review, not the publish.
      - name: Stage npm packages
        run: |
          node scripts/pack-dist.mjs all --registry --out artifacts --pack
          ls -la artifacts/*.tgz
      - name: Smoke-test the edge package from its tarball
        run: |
          set -e
          # Sibling API-client/protocol versions may not be published yet.
          node scripts/pack-dist.mjs edge --out edge-artifacts --pack
          tgz=$(ls "$PWD"/edge-artifacts/augmentd-labs-canvas-edge-*.tgz)
          consumer=$(mktemp -d); cd "$consumer"; npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tgz"
          test -d node_modules/@augmentd-labs/canvas-edge/node_modules/canvas-stored
          CANVAS_USER_HOME=/tmp/edge-ci timeout 8 node node_modules/.bin/canvas-edge --foreground || [ $? -eq 124 ]
      - name: Smoke-test private local agent distribution
        working-directory: .
        run: |
          set -e
          node --test scripts/private-tests/*.test.mjs
          deployment=$(mktemp -d)
          node scripts/export-private-runtime.mjs --out "$deployment/source"
          npm pack "$deployment/source" --pack-destination "$deployment"
          npm install --prefix "$deployment/consumer" --no-audit --no-fund "$deployment"/*.tgz
          node scripts/smoke-runtime.mjs "$deployment/consumer/node_modules/canvas-agentd"
