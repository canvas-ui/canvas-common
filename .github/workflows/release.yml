name: release

# Publishes the shared packages (protocol, schemas, wallpapers, api-client,
# edge) to npm under @augmentd-labs — every version npm does not
# have yet (scripts/publish-npm.mjs), so an unbumped push publishes nothing.
# Release = bump the package version and push main.
#
# Auth is npm trusted publishing: each package on npmjs.com names this repo
# and THIS workflow file as its trusted publisher, GitHub OIDC replaces any
# token, and provenance is attached. Renaming this file breaks publishing
# until the npm settings are updated too.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'runtimes/**'
      - 'scripts/pack-dist.mjs'
      - 'scripts/publish-npm.mjs'
      - 'scripts/public-packages.mjs'
      - 'scripts/check-public-package.mjs'
      - 'scripts/install-public.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .public-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
      - run: npm install -g npm@latest
        working-directory: .
      # pack-dist bundles edge's git dep (canvas-stored) from node_modules.
      - run: node scripts/install-public.mjs
        working-directory: .
      - run: node --test scripts/tests/*.test.mjs
      # The edge package bundles canvas-stored at the commit the lockfile pins.
      # A daemon that cannot start (a stale pin missing an export the edge
      # imports) must fail here, not on the devices that update to it.
      - name: Smoke-test the edge package from its tarball
        run: |
          set -e
          node scripts/pack-dist.mjs edge --out edge-artifacts --pack
          tgz=$(ls "$PWD"/edge-artifacts/augmentd-labs-canvas-edge-*.tgz)
          consumer=$(mktemp -d); cd "$consumer"; npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tgz"
          CANVAS_USER_HOME=/tmp/edge-release timeout 8 node node_modules/.bin/canvas-edge --foreground || [ $? -eq 124 ]
      - run: node scripts/publish-npm.mjs
