packages:
  - packages/*
  - runtimes/*

# pnpm 10 blocks dependency lifecycle scripts by default; allowlist per package.
# - lmdb / msgpackr-extract: runtimes/edge via canvas-stored; prebuilt binaries, the
#   script only picks the platform package
onlyBuiltDependencies:
  - lmdb
  - msgpackr-extract
  - roaring
  - sharp
  - onnxruntime-node
  - koffi
  - protobufjs
  - ssh2
  - cpu-features

# Match the server override: fast-jwt 3 excludes Node 22.
overrides:
  fast-jwt: 6.2.4
